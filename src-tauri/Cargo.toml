[package]
name = "todoom"
version = "0.16.0"
description = "Todoom - gestion de tickets kanban"
authors = ["devsecops-force"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "todoom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
notify-debouncer-mini = "0.7"
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-opener = "2"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

# The taskbar icon and the PR/MR popup's place off the taskbar (windows.rs): the same
# version as Tauri's own, so its window handles are the same type.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
# The mock runtime, to check which window may call which command (tests/window_acl.rs).
tauri = { version = "2", features = ["tray-icon", "test"] }
