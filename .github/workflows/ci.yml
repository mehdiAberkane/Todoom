# Checks every push to main and every pull request: build, lint, tests with
# coverage (interface, Rust on Windows and macOS, agent), Clippy, formatting,
# the dependency audits and an audit of the workflows themselves. The release
# workflow runs it too and only publishes when it passes.
# Actions are pinned to a commit SHA like in release.yml; Dependabot updates them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  checks:
    # Windows: the platform Todoom and its agent run on, and Tauri builds there
    # without extra system packages.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci --ignore-scripts

      - name: Build the interface (type check included)
        run: npm run build

      - name: Lint (ESLint)
        run: npm run lint

      - name: Interface and command tests, with coverage thresholds
        run: npm run test:coverage

      - name: Build the todoom command (type check included)
        run: |
          npm run build:cli
          node dist-cli/todoom.mjs --version

      - name: npm dependency audit
        run: npm audit --audit-level=high

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        # --lib and tests/ (which window may call which command).
        run: cargo test

      - name: Rust dependency audit
        working-directory: src-tauri
        shell: bash
        run: |
          cargo audit --version >/dev/null 2>&1 || cargo install cargo-audit --locked --version 0.23.0
          cargo audit

      - name: Agent tests
        run: python -m unittest discover -s agent -v

  # The Mac build ships too: Clippy and the Rust tests run there as well, since
  # file paths, case and the watcher differ.
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      # Tauri embeds the built interface: build it first.
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        # --lib and tests/ (which window may call which command).
        run: cargo test

  # Static audit of the workflows (injections, permissions, credentials left
  # in the checkout, unpinned actions...).
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  # On a pull request: refuses a new dependency with a known vulnerability
  # (high and above) or an incompatible license, before it lands on main.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
